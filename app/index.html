<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f0e0c" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icons/favicon-64.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="하영의 지도" />
<meta name="mobile-web-app-capable" content="yes" />
<title>하영의 지도</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="./css/style.css?v=14" />
</head>
<body>

<!-- 비밀번호 게이트 -->
<div id="gate" class="gate">
  <div class="gate-card">
    <div class="gate-logo"><span class="pin"></span></div>
    <h1>하영의 지도</h1>
    <p class="gate-sub">내가 저장한 모든 장소를 한 곳에서</p>
    <form id="gate-form" autocomplete="off">
      <input id="gate-input" type="password" inputmode="numeric" placeholder="비밀번호" aria-label="비밀번호" />
      <button type="submit" aria-label="입장">입장하기</button>
    </form>
    <p id="gate-err" class="gate-err" hidden>비밀번호가 올라요. 다시 시도해주세요.</p>
  </div>
</div>

<!-- 앱 본체 -->
<main id="app" class="app" hidden>
  <div id="map" class="map"></div>

  <!-- 상단 플로팅 바 -->
  <header class="topbar">
    <div class="brand"><span class="pin sm"></span><span class="brand-name">하영의 지도</span></div>
    <div class="top-actions">
      <button id="btn-search" class="icon-btn" aria-label="검색"><svg viewBox="0 0 24 24" class="ic"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
      <button id="btn-view" class="icon-btn" aria-label="갤러리 보기"><svg viewBox="0 0 24 24" class="ic"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
    </div>
  </header>

  <!-- 카테고리 칩 -->
  <nav id="chips" class="chips" aria-label="카테고리 필터"></nav>

  <!-- 위치기반 추천 배너 -->
  <div id="nearby" class="nearby" hidden>
    <span class="nearby-dot"></span>
    <span id="nearby-text" class="nearby-text"></span>
    <button id="nearby-close" class="nearby-x" aria-label="닫기">×</button>
  </div>

  <!-- 추천 코스 FAB -->
  <button id="fab" class="fab" aria-label="AI 추천 코스">
    <svg viewBox="0 0 24 24" class="ic"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3.2"/></svg>
    <span>추천 코스</span>
  </button>

  <!-- 검색바 (토글) -->
  <div id="searchbar" class="searchbar" hidden>
    <input id="search-input" type="search" placeholder="장소·지역·메뉴 검색" aria-label="검색어" />
    <button id="search-close" class="icon-btn" aria-label="검색 닫기">×</button>
  </div>

  <!-- 바텀시트: 장소 목록 / 상세 -->
  <section id="sheet" class="sheet" aria-label="장소 정보">
    <div class="sheet-handle" id="sheet-handle"></div>
    <div id="sheet-body" class="sheet-body"></div>
  </section>
</main>

<!-- 갤러리 오버레이 -->
<div id="gallery" class="overlay" hidden>
  <header class="overlay-bar">
    <strong id="gallery-title">갤러리</strong>
    <button id="gallery-close" class="icon-btn" aria-label="갤러리 닫기">×</button>
  </header>
  <div id="gallery-grid" class="gallery-grid"></div>
</div>

<!-- 추천 코스 오버레이 -->
<div id="recommend" class="overlay" hidden>
  <header class="overlay-bar">
    <strong>AI 추천 코스</strong>
    <button id="recommend-close" class="icon-btn" aria-label="닫기">×</button>
  </header>
  <div class="recommend-body">
    <p class="recommend-help">지금 기분과 하고 싶은 걸 적어주세요. 저장한 장소들로 코스를 짜드려요.</p>
    <div class="recommend-examples" id="recommend-examples"></div>
    <textarea id="recommend-input" rows="3" placeholder="예) 오늘 부산인데 대게 먹고 바다 보이는 카페 가고 싶어"></textarea>
    <button id="recommend-go" class="primary-btn">코스 만들기</button>
    <div id="recommend-result" class="recommend-result"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="./js/config.js?v=14"></script>
<script src="./js/app.js?v=14"></script>
</body>
</html>
