name: 매일 즐겨찾기 갱신
on:
  # 매일 새벽 2시(KST) 자동 갱신. GitHub Secrets 에 NAVER_COOKIE 가 있어야 동작한다.
  schedule:
    - cron: "0 17 * * *"   # UTC 17:00 = KST 02:00
  workflow_dispatch: {}      # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 즐겨찾기 목록 수집
        env:
          NAVER_COOKIE: ${{ secrets.NAVER_COOKIE }}
        run: python fetch_bookmarks.py

      - name: 신규 장소만 사진/정보 보강 (증분)
        run: python enrich.py

      - name: 데이터 빌드
        run: python build_data.py

      # CLOUDFLARE_API_TOKEN 시크릿이 있을 때만 배포. 없으면 데이터 커밋까지만 하고 끝난다.
      - name: Cloudflare Pages 배포
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7f53aeca9212909eb3f3f0d62b814c20
        working-directory: app
        run: npx --yes wrangler@4 pages deploy . --project-name favplace --branch main --commit-dirty=true

      - name: 변경분 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/data/places.json app/data/meta.json enriched.jsonl
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 자동 갱신 $(date -u +%Y-%m-%d)"
            git push
          fi
