name: 매일 즐겨찾기 갱신
on:
  schedule:
    - cron: "0 19 * * *"   # UTC 19:00 = KST 04:00 (매일 새벽)
  workflow_dispatch: {}      # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 즐겨찾기 목록 수집
        env:
          NAVER_COOKIE: ${{ secrets.NAVER_COOKIE }}
        run: python fetch_bookmarks.py

      - name: 신규 장소만 사진/정보 보강 (증분)
        run: python enrich.py

      - name: 데이터 빌드
        run: python build_data.py

      - name: 변경분 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/data/places.json app/data/meta.json enriched.jsonl
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 자동 갱신 $(date -u +%Y-%m-%d)"
            git push
          fi
